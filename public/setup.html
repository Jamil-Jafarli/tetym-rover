<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurulum · ne yapmalıyım</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a323d; --ink:#e6edf3; --dim:#8b949e;
    --accent:#3fb950; --warn:#d29922; --stop:#f85149; --idle:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f2f4f7; --panel:#fff; --line:#d6dce4; --ink:#1c2128; --dim:#5a6570; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  h1{font-size:17px;margin:0;font-weight:600}
  a{color:var(--idle)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.ok{background:var(--accent)} .dot.bad{background:var(--stop)}
  .muted{color:var(--dim);font-size:13px}
  .lbl{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
  button{font:600 14px/1 inherit;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.on{background:var(--accent);border-color:var(--accent);color:#04220c}
  input[type=number]{width:100%;font:600 22px/1.1 ui-monospace,Menlo,monospace;
    font-variant-numeric:tabular-nums;text-align:center;padding:9px 6px;
    color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
  input[type=number]:focus{outline:none;border-color:var(--idle)}
  input[type=range]{width:100%;accent-color:var(--idle)}

  /* ── one step ─────────────────────────────────────────────────── */
  .step{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;display:flex;gap:14px}
  .step.done{border-color:var(--accent)}
  .step.blocked{opacity:.5}
  .num{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex:none;
    font:600 13px ui-monospace,Menlo,monospace;color:var(--dim)}
  .step.done .num{background:var(--accent);border-color:var(--accent);color:#04220c}
  .step.blocked .num{border-style:dashed}
  .body{flex:1;min-width:0}
  .body h3{margin:2px 0 8px;font-size:15px;font-weight:600}
  .body p{margin:0 0 7px}
  .what{color:var(--ink)}
  .then{color:var(--ink)}
  .why{color:var(--dim);font-size:13px;border-left:2px solid var(--line);
    padding-left:10px;margin-top:10px}
  .where{font:11px/1 ui-monospace,Menlo,monospace;color:var(--dim)}
  .field{display:flex;align-items:center;gap:10px;margin-top:12px}
  .field label{font-size:13px;color:var(--dim);flex:none;width:74px}
  .field .u{font:12px ui-monospace,Menlo,monospace;color:var(--dim);flex:none;width:78px}
  .drive{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:10px}
  .drive .row{margin-bottom:8px}
  .hold{width:100%;padding:16px;font-size:15px;letter-spacing:.6px;
    touch-action:none;user-select:none}
  .hold.live{background:var(--warn);border-color:var(--warn);color:#231a02}
  .live-v{font:600 20px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .warnbox{border-color:var(--warn)}
  /* The dump is written with newlines because it is meant to be read as three
     lines, not as one paragraph that happens to contain full stops. */
  #dump{white-space:pre-line}
  .nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px}
  .warnbox b{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row">
      <h1>Kurulum — ne yapmalıyım</h1>
      <span class="row" style="gap:7px"><span class="dot" id="dot"></span>
        <span class="muted" id="link">bağlanıyor…</span></span>
    </div>
    <p class="muted" style="margin:10px 0 0">Bu sayfadaki sayılar sunucuda
    saklanır ve <b>bütün sayfalarda</b> kullanılır — /manual, /drive, /follow,
    /tune. Bir kez ölç, her yerde doğru olsun.</p>
    <div class="nav">
      <a href="/">← ana sayfa</a><a href="/manual">/manual</a><a href="/drive">/drive</a>
      <a href="/follow">/follow</a><a href="/pins">/pins</a>
    </div>
  </div>

  <div class="card warnbox" id="banner" hidden>
    <b>Dikkat —</b> <span id="bannerTxt"></span>
  </div>

  <div id="steps"></div>

  <div class="card">
    <div class="lbl" style="margin-bottom:8px">Mevcut ayarlar</div>
    <p class="muted" id="dump" style="margin:0;font:12px/1.6 ui-monospace,Menlo,monospace"></p>
    <div class="row" style="margin-top:14px;gap:8px">
      <button id="reset" style="flex:1">Hepsini sıfırla</button>
      <button id="save" style="flex:2">Kaydet</button>
    </div>
    <p class="muted" id="saved" style="margin:10px 0 0"></p>
  </div>

</div>

<script src="/wheels.js"></script>
<script>
const $ = id => document.getElementById(id);

// ── connection ────────────────────────────────────────────────────
let ws = null, cfg = { pilot: {} }, vmax = 3.3, held = null;

// The single source of truth for what the sliders on /follow will read, so the
// two pages cannot drift: both send the same follow_cfg and both are told the
// result by the server's next status frame.
const trim = () => wheelsOf(cfg);
const edited = {};        // what this page has changed but not yet pushed

function value(key) {
  if (key in edited) return edited[key];
  const t = trim();
  return t[key];
}

function setValue(key, v) { edited[key] = v; render(); }

function pushCfg() {
  const pilot = { ...(cfg.pilot || {}) };
  for (const k of Object.keys(edited)) pilot[k] = edited[k];
  send({ cmd: 'follow_cfg', cfg: { ...cfg, pilot } });
  $('saved').textContent = 'kaydedildi · ' + new Date().toLocaleTimeString();
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ── the one-wheel tester ──────────────────────────────────────────
// Each measuring step gets its own, because the measurement IS "raise this one
// pin until this one wheel moves" and making you leave for another page to do
// it is how the number ends up guessed instead of measured.
//
// Hold to run. Releasing stops, and so does losing the pointer, the tab or the
// socket — the server's dead-man does the last one for us.
function tester(pin) {
  const box = document.createElement('div');
  box.className = 'drive';
  box.innerHTML = `
    <div class="row">
      <span class="muted">GPIO${pin} — yalnız bu teker</span>
      <span class="live-v"><span class="tv">0</span> % · <span class="tvv">0.00</span> V</span>
    </div>
    <input type="range" min="0" max="100" step="1" value="0">
    <button class="hold">BASILI TUT — sür</button>
    <p class="muted" style="margin:8px 0 0">Basılı tut, sürgüyü yavaş yavaş
    yükselt. Tekerin ilk döndüğü sayıyı aşağıya yaz.</p>`;
  const rng = box.querySelector('input');
  const btn = box.querySelector('.hold');
  const paint = () => {
    const v = Number(rng.value);
    box.querySelector('.tv').textContent = v;
    box.querySelector('.tvv').textContent = ((v / 100) * vmax).toFixed(2);
    if (held === pin) drive(v);
  };
  // Raw percentages, deliberately: this is the measurement that PRODUCES the
  // dead band, so it must not be run through the dead band.
  const drive = (v) => send({ cmd: 'set', p25: pin === 25 ? v : 0,
                                          p26: pin === 26 ? v : 0 });
  const start = (e) => {
    e.preventDefault();
    held = pin;
    btn.classList.add('live');
    btn.textContent = 'SÜRÜYOR — bırakınca durur';
    send({ cmd: 'start', p25: pin === 25 ? Number(rng.value) : 0,
                         p26: pin === 26 ? Number(rng.value) : 0 });
  };
  const stop = () => {
    if (held !== pin) return;
    held = null;
    btn.classList.remove('live');
    btn.textContent = 'BASILI TUT — sür';
    send({ cmd: 'idle' });
  };
  rng.addEventListener('input', paint);
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('pointerleave', stop);
  window.addEventListener('blur', stop);
  paint();
  return box;
}

// ── rendering ─────────────────────────────────────────────────────
const FIELDS = {
  stall25: [{ key: 'stall25', label: 'GPIO25', unit: '% — ilk dönen yüzde',
              min: 0, max: 60, step: 1, pin: 25 }],
  stall26: [{ key: 'stall26', label: 'GPIO26', unit: '% — ilk dönen yüzde',
              min: 0, max: 60, step: 1, pin: 26 }],
  gain: [{ key: 'gain25', label: 'GPIO25 güç', unit: '0.50 – 1.50',
           min: 0.5, max: 1.5, step: 0.01 },
         { key: 'gain26', label: 'GPIO26 güç', unit: '0.50 – 1.50',
           min: 0.5, max: 1.5, step: 0.01 }],
};

function render() {
  const merged = { ...trim(), ...edited };
  const steps = wheelsSteps(merged);
  const host = $('steps');
  const openTester = [...host.querySelectorAll('.drive')]
    .map(d => d.parentElement.dataset.id);   // keep testers open across repaints
  host.innerHTML = '';

  for (const s of steps) {
    const el = document.createElement('div');
    el.className = 'step' + (s.done ? ' done' : '') + (s.blocked ? ' blocked' : '');
    el.dataset.id = s.id;
    const tick = s.done === true ? '✓' : s.blocked ? '·' : String(s.n);
    el.innerHTML = `
      <div class="num">${tick}</div>
      <div class="body">
        <h3>${s.title}${infoHtml(s.id === 'gain' ? 'gain25' : s.id)}</h3>
        <p class="where">${s.where}</p>
        <p class="what"><b>Et:</b> ${s.what}</p>
        <p class="then"><b>Sonra:</b> ${s.then}</p>
        <p class="why">${s.why}</p>
      </div>`;
    const body = el.querySelector('.body');

    if (s.blocked) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.style.marginTop = '10px';
      p.textContent = 'Önceki adımlar tamamlanmadı — bu adım henüz anlamsız.';
      body.appendChild(p);
    } else {
      for (const f of (FIELDS[s.id] || [])) {
        if (f.pin) body.appendChild(tester(f.pin));
        const row = document.createElement('div');
        row.className = 'field';
        row.innerHTML = `<label>${f.label}</label>`;
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.min = f.min; inp.max = f.max; inp.step = f.step;
        const cur = merged[f.key];
        inp.value = cur === null ? '' : cur;
        inp.placeholder = '—';
        inp.addEventListener('input', () => {
          const raw = inp.value.trim();
          const n = raw === '' ? null : Number(raw);
          edited[f.key] = (n === null || !isFinite(n)) ? null : n;
          repaintDump();
        });
        inp.addEventListener('change', () => { pushCfg(); render(); });
        const u = document.createElement('span');
        u.className = 'u';
        u.textContent = f.unit;
        row.append(inp, u);
        body.appendChild(row);
      }
    }
    host.appendChild(el);
  }
  repaintDump();
}

function repaintDump() {
  const m = wheelsOf({ ...trim(), ...edited });
  const [a, b] = wheelsSummary(m);
  $('dump').textContent = `${a}\n${b}\ngenel eşik ${m.stall} %  ·  tavan ${vmax.toFixed(2)} V`
    + `\ntaraflar ${m.swap ? 'değiştirildi' : 'normal'}`;
  const measured = wheelsMeasured(m);
  $('banner').hidden = measured;
  $('bannerTxt').textContent = 'tekerlerin dönme eşiği henüz ölçülmedi. '
    + 'Bu ölçülmeden robot düşük hızda sapar ve döner — 2. ve 3. adım.';
}

$('save').addEventListener('click', () => { pushCfg(); render(); });
$('reset').addEventListener('click', () => {
  if (!confirm('Bütün teker ayarları varsayılana dönsün mü?')) return;
  for (const k of ['stall25', 'stall26']) edited[k] = null;
  edited.gain25 = 1; edited.gain26 = 1;
  pushCfg(); render();
});

// ── websocket ─────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/`);
  ws.onopen = () => { $('dot').className = 'dot ok'; $('link').textContent = 'bağlandı'; };
  ws.onclose = () => {
    $('dot').className = 'dot bad';
    $('link').textContent = 'bağlantı yok — çıkış sıfırlandı';
    held = null;
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    let s; try { s = JSON.parse(ev.data); } catch { return; }
    if (s.type !== 'status') return;
    if (s.vmax) vmax = s.vmax;
    if (s.follow_cfg) {
      const before = JSON.stringify(trim());
      cfg = s.follow_cfg;
      // Only redraw when the server actually told us something new; otherwise
      // the 10 Hz push would rip the field out from under the keyboard.
      if (JSON.stringify(trim()) !== before && !document.activeElement.matches('input')) {
        for (const k of Object.keys(edited)) delete edited[k];
        render();
      }
    }
    if (!s.esp_fresh) $('link').textContent = 'ESP32 telemetrisi yok';
    else if (ws.readyState === 1) $('link').textContent = 'ESP32 bağlı';
  };
}

wheelsMount({ strip: false });
render();
connect();
</script>
</body>
</html>
